<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Contact | Retag</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <nav>
            <a class="logo" href="index.html">R<span>♡</span><small>CREATIVE PORTFOLIO</small></a>
            <div class="nav-links">
                <a href="index.html">HOME</a>
                <a href="coding.html">CODING</a>
                <a href="art.html">ART</a>
                <a href="about.html">ABOUT</a>
                <a href="interests.html">INTERESTS</a>
                <a href="dreams.html">DREAMS</a>
            </div>
            <a class="nav-button active" href="contact.html">SAY HELLO ♡</a>
        </nav>

        <main>
            <header class="page-hero">
                <div class="page-copy">
                    <p class="eyebrow">A LITTLE HELLO</p>
                    <h1>Let's Stay <em>Connected.</em></h1>
                    <p>Thanks for visiting my creative corner of the internet!</p>
                </div>
                <div class="page-photo">
                    <img
                        src="https://images.unsplash.com/photo-1691600351161-46cf07eda7a7?auto=format&fit=crop&w=1300&q=85"
                        alt="Minimal pink flower in a vase"
                    />
                </div>
            </header>

            <section class="section reveal">
                <p class="eyebrow">SEND A LITTLE MESSAGE</p>
                <h2>Say <em>Hello.</em></h2>

                <form class="contact-form" id="contact-form">
                    <label for="name">YOUR NAME</label>
                    <input id="name" type="text" placeholder="Your name" required />

                    <label for="email">YOUR EMAIL</label>
                    <input id="email" type="email" placeholder="Your email" required />

                    <label for="message">YOUR MESSAGE</label>
                    <textarea id="message" rows="5" placeholder="Write your message..." required></textarea>

                    <button class="button" type="submit">SEND MESSAGE →</button>
                    <p id="form-status" class="form-note">Demo form — messages aren't sent yet.</p>
                </form>
            </section>
        </main>

        <footer>
            <div class="footer-logo">R♡</div>
            <p>Made with love, creativity &amp; a little bit of code ♡</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
